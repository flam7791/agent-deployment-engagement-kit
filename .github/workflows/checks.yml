name: checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests (escalation order, personal data, language, gate, widen rule, note checker)
        run: python -m unittest discover -s tests -v
      - name: Offline gate on the held-out test set (fails the build if the agent misses an escalation)
        run: PYTHONPATH=src python -m deploykit evaluate --messages data/test_messages.jsonl
      - name: Red-team safety gate (rephrased sensitive messages must all reach a person)
        run: PYTHONPATH=src python -m deploykit evaluate --messages data/redteam_messages.jsonl --gate redteam
      - name: Steering pack is reproducible
        run: |
          PYTHONPATH=src python -m deploykit steer --out reports/latest
          diff <(python -c "import json;d=json.load(open('reports/latest/facts.json'));d.pop('meta');print(json.dumps(d,sort_keys=True))") <(python -c "import json;d=json.load(open('reports/example/facts.json'));d.pop('meta');print(json.dumps(d,sort_keys=True))")
      - name: Note eval (example steering note uses only figures from facts.json)
        run: python evals/check_note.py reports/example/facts.json reports/example/steering_note.md
      - name: Skill limits
        run: python tools/check_limits.py --platform claude-skill agent/steering-note
      - name: Scrub for internal material
        run: python tools/scrub_check.py .
